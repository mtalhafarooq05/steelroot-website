<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype D - Side-Scroller</title>
    <style>
        :root {
            --bg-color: #e5e5e5;
            --text-color: #111;
            --accent: #ff3366;
        }
        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow-y: hidden;
            overflow-x: auto;
        }
        
        .horizontal-container {
            display: flex;
            width: fit-content;
            height: 100vh;
        }
        
        .panel {
            width: 100vw;
            height: 100vh;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            box-sizing: border-box;
            border-right: 2px solid var(--text-color);
            position: relative;
        }
        
        .panel:nth-child(even) {
            background-color: var(--text-color);
            color: var(--bg-color);
        }
        
        h1 {
            font-size: 8vw;
            margin: 0;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -2px;
        }
        
        .outline-text {
            color: transparent;
            -webkit-text-stroke: 2px var(--text-color);
        }
        .panel:nth-child(even) .outline-text {
            -webkit-text-stroke: 2px var(--bg-color);
        }
        
        .media-placeholder {
            flex-grow: 1;
            background: rgba(0,0,0,0.1);
            border: 2px solid currentColor;
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;
            text-transform: uppercase;
        }
        
        .nav-back {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--text-color);
            text-decoration: none;
            padding: 10px 20px;
            background: var(--bg-color);
            border: 2px solid var(--text-color);
            font-weight: bold;
            z-index: 100;
            text-transform: uppercase;
        }
        .nav-back:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }
        
        .scroll-hint {
            position: absolute;
            bottom: 40px;
            right: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            animation: bounceLeft 2s infinite;
        }
        
        @keyframes bounceLeft {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-20px); }
        }
    </style>
</head>
<body>
    <a href="index.html" class="nav-back">← Back to Menu</a>
    
    <div class="horizontal-container">
        <!-- Panel 1: Intro -->
        <div class="panel">
            <h1>Roblox<br><span class="outline-text">Developer</span></h1>
            <div class="scroll-hint">SCROLL RIGHT →</div>
        </div>
        
        <!-- Panel 2: Big Project -->
        <div class="panel">
            <h1 style="font-size: 4vw;">Project: Neon City</h1>
            <div class="media-placeholder">Large Video Showcase Goes Here</div>
        </div>
        
        <!-- Panel 3: Mechanics -->
        <div class="panel">
            <h1 style="font-size: 4vw;">Mechanics &<br><span class="outline-text">Scripting</span></h1>
            <div style="display: flex; gap: 2rem; height: 100%; margin-top: 2rem;">
                <div class="media-placeholder" style="margin-top: 0; flex: 1;">Combat System</div>
                <div class="media-placeholder" style="margin-top: 0; flex: 1;">Movement</div>
            </div>
        </div>
    </div>
</body>
</html>
